version: "3.7"

services:
  app:
    image: warehouse-monitor:latest
    build:
      context: ./app
      dockerfile: Dockerfile
    user: "1000:1000"
    restart: on-failure
    environment:
      PORT: 5000
      APP_DATA_DIR: /data
      NODE_ENV: production
    volumes:
      - ${APP_DATA_DIR}/data:/data
    ports:
      - ${APP_PROXY_PORT}:5000
