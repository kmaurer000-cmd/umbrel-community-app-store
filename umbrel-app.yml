manifestVersion: 1
id: warehouse-monitor
category: productivity
name: Lager Monitor
version: "1.0.0"
tagline: Lagerverwaltung mit Bestand, Warenein-/ausgang und Umsatzübersicht
description: >-
  Lager Monitor ist eine einfache und effektive Lagerverwaltungslösung für kleine und mittlere Unternehmen.
  
  **Features:**
  
  📦 **Produktverwaltung** - Verwalten Sie Ihre Produkte mit Namen, SKU und Preis
  
  📥 **Wareneingang** - Buchen Sie neue Ware und aktualisieren Sie automatisch den Bestand
  
  📤 **Warenausgang** - Erfassen Sie Verkäufe und Entnahmen
  
  💰 **Umsatzübersicht** - Sehen Sie Ihre Verkaufsumsätze und Top-Produkte
  
  📊 **Bestandskontrolle** - Behalten Sie den Überblick über Ihren aktuellen Lagerbestand
  
  🔐 **Vollständig Verschlüsselt** - Alle Daten mit AES-Verschlüsselung lokal gespeichert
  
  
  **Erste Schritte:**
  
  1. Öffnen Sie die App (PIN: 9045)
  2. Legen Sie Lieferanten an
  3. Erstellen Sie Ihre Produkte
  4. Buchen Sie Wareneingänge und -ausgänge
  5. Überwachen Sie Ihre Umsätze und Gewinne
  
  Alle Daten werden verschlüsselt lokal im Browser gespeichert - vollständige Privatsphäre auf Ihrem Umbrel-Server.

developer: Umbrel Community
website: https://github.com/getumbrel/umbrel-apps
dependencies: []
